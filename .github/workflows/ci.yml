name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build deps (aws-lc-rs needs cmake)
        run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  # Static musl binaries, built natively on each arch (no `cross` required).
  build-musl:
    name: static musl (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl + cmake toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Build (static)
        env:
          # aws-lc-rs compiles C — build it with the native musl compiler.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify it is statically linked
        run: |
          bin=target/${{ matrix.target }}/release/slowloris
          file "$bin"
          file "$bin" | grep -q "statically linked"
      - uses: actions/upload-artifact@v4
        with:
          name: slowloris-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/slowloris
          if-no-files-found: error
