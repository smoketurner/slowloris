name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to a full commit SHA (with the human-readable
# version in a trailing comment) so a moved tag can't change what runs.
jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install build deps (aws-lc-rs needs cmake)
        run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  # Static musl binaries, built natively on each arch (no `cross` required).
  build-musl:
    name: static musl (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl + cmake toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Build (static)
        env:
          # aws-lc-rs compiles C — build it with the native musl compiler.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify it is statically linked
        run: |
          bin=target/${{ matrix.target }}/release/slowloris
          file "$bin"
          # musl static binaries are static-PIE; `file` may report either form.
          file "$bin" | grep -qE "statically linked|static-pie linked"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slowloris-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/slowloris
          if-no-files-found: error
