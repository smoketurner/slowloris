[package]
name = "slowloris"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A small, statically-linkable slow-HTTP resilience tester (Slowloris / slow-body / slow-read) for authorized load and DoS-resilience testing of your own web servers."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smoketurner/slowloris"
readme = "README.md"
keywords = ["slowloris", "http", "load-testing", "security", "dos"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "slowloris"
path = "src/main.rs"

# Every dependency is pinned to an exact version (`=x.y.z`) with default
# features disabled; only the features actually used are re-enabled. TLS goes
# through rustls + aws-lc-rs (never ring or OpenSSL), matching the crypto
# convention used across smoketurner's Rust projects.
[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
mimalloc = { version = "=0.1.52", default-features = false, features = ["secure"] }
socket2 = { version = "=0.5.10", default-features = false }

# TLS goes through rustls + aws-lc-rs (never ring or OpenSSL). aws-lc-rs is also
# reused as the entropy source for cosmetic request jitter, so there is no
# separate RNG crate.
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
aws-lc-rs = { version = "=1.18.1", default-features = false }
webpki-roots = { version = "=1.0.9", default-features = false }

[lints.rust]
# Apple ld can emit a spurious "__eh_frame section too large" note on some
# release builds; a known false positive with no rustc filter yet:
# https://github.com/rust-lang/rust/issues/159105. Remove when rustc filters it.
linker_messages       = "allow"
unsafe_code           = "deny"
unreachable_pub       = "warn"
non_ascii_idents      = "deny"
trivial_casts         = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes      = "warn"
single_use_lifetimes  = "warn"

[lints.clippy]
# Whole pedantic group on as warnings; specific rules below override it.
pedantic = { level = "warn", priority = -1 }

# No disallowed-methods list is configured for this crate, so this is a no-op
# default; kept to match the shared lint baseline.
disallowed_methods = "allow"

# Own-crate items are imported with `use`, not spelled inline as deep paths.
# Scoped in `.clippy.toml` (`absolute-paths-allowed-crates`) so std and the
# external dependencies may still be written inline.
absolute_paths = "deny"

# Panic prevention
unwrap_used         = "deny"
expect_used         = "deny"
panic               = "deny"
unreachable         = "deny"
todo                = "deny"
unimplemented       = "deny"
exit                = "deny"
unwrap_in_result    = "deny"
panic_in_result_fn  = "deny"
get_unwrap          = "deny"

# Indexing / slicing can panic — prefer .get()
indexing_slicing    = "deny"
string_slice        = "deny"

# Arithmetic that can panic or silently misbehave
modulo_arithmetic       = "deny"
integer_division        = "deny"
arithmetic_side_effects = "deny"

# Lossy / surprising numeric `as` casts
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"
cast_possible_wrap       = "deny"
cast_precision_loss      = "deny"
checked_conversions      = "deny"

# Time / float hazards
unchecked_time_subtraction = "deny"
float_cmp           = "deny"
float_cmp_const     = "deny"
lossy_float_literal = "deny"
zero_divided_by_zero = "deny"

# Conversions / formatting that hide panics
fallible_impl_from   = "deny"
recursive_format_impl = "deny"

# Stack / iteration hazards
large_stack_arrays  = "deny"
large_stack_frames  = "deny"
infinite_iter       = "deny"

# Uninitialized memory / UB
mem_replace_with_uninit = "deny"
uninit_assumed_init     = "deny"
uninit_vec              = "deny"

# Async / concurrency safety
await_holding_lock = "deny"
large_futures      = "deny"
mem_forget         = "deny"
mutex_atomic       = "deny"

# Hygiene
dbg_macro          = "deny"
# This is a command-line app: its stdout/stderr output (banner, live progress,
# errors) is the user-facing interface, not stray debugging.
print_stdout       = "allow"
print_stderr       = "allow"
rc_buffer          = "deny"
map_unwrap_or      = "deny"
let_underscore_must_use = "deny"

# No silent escape hatches: every allow must justify itself (use #[expect]).
allow_attributes              = "deny"
allow_attributes_without_reason = "deny"

# Ratchet against monolithic functions.
too_many_lines = "warn"

# Pedantic relaxations (too noisy for this codebase style).
module_name_repetitions = "allow"
similar_names           = "allow"

[profile.release]
strip = true      # strip symbols from the binary
lto = true        # full link-time optimization for size
codegen-units = 1 # maximize size reduction
panic = "abort"   # terminate on panic (also drops unwinding tables)
opt-level = "z"   # optimize aggressively for size
